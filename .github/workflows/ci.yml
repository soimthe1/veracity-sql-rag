name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y unixodbc
      - run: pip install -r requirements.txt -r requirements-dev-test.txt
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.quickstart.yaml up -d --build
      - name: Wait for api and answer
        run: |
          curl -fsS --retry 40 --retry-delay 3 --retry-all-errors http://localhost:8180/api/health
          curl -fsS --retry 40 --retry-delay 3 --retry-all-errors http://localhost:8180/answer/health
      - if: failure()
        run: docker compose -f docker-compose.quickstart.yaml logs
