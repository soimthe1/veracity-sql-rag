[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Deliberately left BLANK. Never put a real connection string/secret here
# — this file ships inside the repo and both the engine and api Docker
# images. migrations/env.py builds the real URL at runtime from
# shared/config.py's load_config().catalog.database.sqlalchemy_url,
# so no connection string is stored here.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
