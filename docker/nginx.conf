server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # env.js is regenerated per-container-start by docker-entrypoint-web.sh
    # — never cache it, or a redeployed API_BASE_URL won't take effect
    # until every client's cache expires.
    location = /env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files /env.js =404;
    }

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
