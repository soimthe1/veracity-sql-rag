# Quick start: one origin. The browser talks to /api and /answer here; nginx
# forwards them to the containers, so no CORS and only one published port.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # Docker's DNS, re-asked every 10 s: a restarted api/answer container gets a
    # new address, and a fixed proxy_pass would keep the old one (502 until the
    # web container is restarted too). Variables force the lookup per request.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8100;
    set $answer_upstream http://answer:8200;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /answer/ {
        rewrite ^/answer/(.*)$ /$1 break;
        proxy_pass $answer_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
    location = /env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files /env.js =404;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri /index.html;
    }
}
